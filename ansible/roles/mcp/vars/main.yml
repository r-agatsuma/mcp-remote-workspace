  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
mcp_public_protocol_v4: [192.0.0.9/32, 192.0.0.10/32]
mcp_nonpublic_v6:
