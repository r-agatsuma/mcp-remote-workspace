---
# These stat results contain metadata only, never file contents or their digest.
- name: Inspect credential directory metadata only
  ansible.builtin.stat:
    path: /etc/mcp-tunnel
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: mcp_tunnel_secret_directory

- name: Require the exact protected credential directory
  ansible.builtin.assert:
    that:
      - mcp_tunnel_secret_directory.stat.isdir | default(false)
      - not mcp_tunnel_secret_directory.stat.islnk
      - mcp_tunnel_secret_directory.stat.uid == 0
      - mcp_tunnel_secret_directory.stat.gr_name == 'mcp-tunnel'
      - mcp_tunnel_secret_directory.stat.mode == '0750'

- name: Inspect Human-staged key metadata as its runtime reader without content inspection
  ansible.builtin.stat:
    path: /etc/mcp-tunnel/control-plane-api-key
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  become_user: mcp-tunnel
  register: mcp_tunnel_secret_metadata

- name: Fail closed on missing or incorrect key metadata
  ansible.builtin.assert:
    that:
      - mcp_tunnel_secret_metadata.stat.isreg | default(false)
      - not mcp_tunnel_secret_metadata.stat.islnk
      - mcp_tunnel_secret_metadata.stat.pw_name == 'mcp-tunnel'
      - mcp_tunnel_secret_metadata.stat.gr_name == 'mcp-tunnel'
      - mcp_tunnel_secret_metadata.stat.mode == '0600'
      - mcp_tunnel_secret_metadata.stat.readable
    fail_msg: 'STOP: Human must stage the protected runtime key; Ansible never handles its content.'

- name: Require that runner has no effective credential read access without opening it
  ansible.builtin.command:
    argv: [/usr/bin/test, -r, /etc/mcp-tunnel/control-plane-api-key]
  become_user: mcp-runner
  changed_when: false
  register: mcp_runner_secret_access
  failed_when: mcp_runner_secret_access.rc != 1
