---
- name: Establish production deployment prerequisites and services
  hosts: mcp_hosts
  become: true
  gather_facts: true
  vars:
    mcp_deployment_stage: final
  pre_tasks:
    - name: Require source policy and fresh final Data identity before mutation
      ansible.builtin.import_tasks: tasks/deployment_preflight.yml
  roles:
    - s3a
    - s3b
    - s3c
    - s3d
    - s3e
