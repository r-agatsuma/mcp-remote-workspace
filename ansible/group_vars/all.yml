---
mcp_source_revision: REPLACE_WITH_40_HEX_COMMIT
mcp_target_ssh_host_key_sha256: REPLACE_WITH_ACCEPTED_SSH_SHA256_FINGERPRINT

mcp_runner_user: mcp-runner
mcp_tunnel_user: mcp-tunnel
mcp_source_path: /usr/local/src/mcp-workspaced
mcp_go_toolchain: go1.26.9

# Shared trusted production endpoint for the listener, Tunnel target and S3D.
mcp_production_endpoint:
  address: 127.0.0.1
  port: 8080

# S3B fixed reference paths; no bootstrap enable is stored in inventory.
mcp_data_mount: /srv/mcp-podman
mcp_runner_home: /srv/mcp-podman/runner
mcp_runtime_graphroot: /srv/mcp-podman/runner/.local/share/containers/storage
mcp_runtime_static_dir: /srv/mcp-podman/runner/.local/share/containers/storage/libpod
mcp_runtime_volume_path: /srv/mcp-podman/runner/.local/share/containers/storage/volumes
mcp_runtime_tmp: /srv/mcp-podman/tmp
mcp_runtime_events: /srv/mcp-podman/events/events.log
mcp_workspace_data_dir: /srv/mcp-podman/workspaces
mcp_workspace_state_dir: /srv/mcp-podman/runner/.local/state/mcp-workspaced

# Trusted per-host inputs. These placeholders intentionally fail closed.
mcp_data_device_id: /dev/disk/by-id/REPLACE_WITH_WHOLE_DATA_DEVICE_ID
mcp_data_expected_serial: REPLACE_WITH_EXPECTED_UDEV_ID_SERIAL
# Source-owned v0 reference capacity, not a universal storage invariant.
mcp_data_expected_bytes: 107374182400
mcp_data_expected_sector_bytes: 0
mcp_data_uuid: REPLACE_WITH_BOOTSTRAP_RESULT_UUID
mcp_runner_subuid_start: 0
mcp_runner_subgid_start: 0
# Source-owned reference allocation length; starts remain host-selected.
mcp_runner_subid_count: 65536

# Source-owned v0 reference-deployment policy (#152), not universal product
# invariants. Changes require a reviewed source revision, never manifest vars.
mcp_public_dns:
  - 8.8.8.8
  - 8.8.4.4
# Exactly one provider NAT IPv4 and one guest-joined public GUA IPv6.
# LOCAL independently denies interface-local destinations.
# Fail closed: supplied only by the formal entry's provider/guest join.
mcp_host_public_ipv4: ''
mcp_host_gua_ipv6: ''

# S3E: the only shared daemon/recovery configuration authority. ReferencePolicy
# values and the canonical image are source policy; only Tunnel ID is per-instance.
# S3E converges this exact public, fully qualified digest reference in the final
# runner store before service activation. Runtime canonical creation never pulls.
mcp_canonical_image: ghcr.io/r-agatsuma/mcp-workspace-base@sha256:8af2148405bfa66bfd522d820145ccd7a19ca9f9cfe39ee609861d082b1680d8
mcp_tunnel_id: REPLACE_WITH_TUNNEL_ID
mcp_workspaced_config:
  image: "{{ mcp_canonical_image }}"
  state-dir: "{{ mcp_workspace_state_dir }}"
  data-dir: "{{ mcp_workspace_data_dir }}"
  podman: /usr/bin/podman
  public-dns: "{{ mcp_public_dns_validated }}"
  tool-timeout: 30s
  memory-bytes: 4294967296
  max-generations: 2
  swap-bytes: 0
  cpu-quota: -1
  cpu-weight: 100
  pids-max: 512
  migration-tasks-max: 513
  nofile: 1024
  max-backend-operations: 4
  idle-ttl: 30m
  absolute-ttl: 24h
  min-available-bytes: 1073741824
  min-free-inodes: 1024
