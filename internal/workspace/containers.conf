# Embedded in mcp-workspaced and supplied through CONTAINERS_CONF. No host or
# user containers.conf files, overrides, or modules participate in this profile.
[containers]
annotations = []
base_hosts_file = "none"
devices = []
mounts = []
volumes = []
default_capabilities = []
default_sysctls = []
default_ulimits = []
env = []
env_host = false
http_proxy = false
privileged = false
read_only = false
pidns = "private"
ipcns = "private"
userns = "private"
utsns = "private"
cgroupns = "private"
cgroups = "enabled"
pids_limit = 256
host_containers_internal_ip = "none"
log_driver = "k8s-file"
log_size_max = 1048576
tz = "UTC"

[engine]
remote = false
active_service = ""
env = []
conmon_env_vars = ["PATH=/usr/bin:/bin"]
conmon_path = ["/usr/bin/conmon"]
helper_binaries_dir = ["/usr/lib/podman", "/usr/libexec/podman", "/usr/bin"]
hooks_dir = []
cdi_spec_dirs = []
network_cmd_path = "/usr/bin/slirp4netns"
network_cmd_options = []
cgroup_manager = "systemd"
runtime = "crun"
events_logger = "file"
pull_policy = "never"

[engine.runtimes]
crun = ["/usr/bin/crun"]

[network]
network_backend = "netavark"
default_rootless_network_cmd = "slirp4netns"
pasta_options = []
